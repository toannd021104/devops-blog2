<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12161d"/>
      <stop offset="1" stop-color="#0b0e13"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="28%" r="46%">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <!-- Meeting -> tasks: calendar with a check -->
    <g id="quick" fill="none" stroke="#14b8a6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/>
      <path d="M3 9h18"/>
      <path d="M7.5 2.5v4M16.5 2.5v4"/>
      <path d="M8 14.5l2.6 2.6L16 12"/>
    </g>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Icon lớn mờ nền phải -->
  <g transform="translate(840,180) scale(20)" opacity="0.09">
    <use href="#quick"/>
  </g>

  <rect x="64" y="120" width="48" height="4" rx="2" fill="#14b8a6"/>
  <text x="64" y="166" font-family="'JetBrains Mono',monospace" font-size="20" letter-spacing="3" fill="#14b8a6">DEVOPS</text>

  <text font-family="'Lexend','Inter',sans-serif" font-size="50" font-weight="700" fill="#ffffff">
    <tspan x="64" y="252">Amazon Quick: trợ lý meeting</tspan>
    <tspan x="64" y="314" font-size="38">biến cuộc họp thành task</tspan>
  </text>

  <g transform="translate(64,420)">
    <rect width="245" height="34" rx="17" fill="#14b8a6" fill-opacity="0.15"/>
    <text x="16" y="23" font-family="'JetBrains Mono',monospace" font-size="15" fill="#14b8a6">amazon-quick · follow-up</text>
  </g>

  <text x="64" y="566" font-family="'JetBrains Mono',monospace" font-size="18" fill="#8b93a1">Toan Nguyen<tspan fill="#14b8a6">.</tspan>devops</text>

  <!-- Huy hiệu nhỏ góc phải trên -->
  <g transform="translate(1040,56)">
    <rect width="96" height="96" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#14b8a6" stroke-opacity="0.4"/>
    <g transform="translate(24,24) scale(2)">
      <use href="#quick"/>
    </g>
  </g>
</svg>
